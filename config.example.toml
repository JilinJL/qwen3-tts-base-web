[qwen3_tts]
device = "auto"
model = "1.7B"
source = "domestic"
host = "0.0.0.0"
port = 8001
offline = false
# Optional HTTPS endpoints; empty strings use the source profile defaults.
pip_index = ""
torch_index = ""
hf_endpoint = ""

[tts_agent]
# Required for the Windows worker. Use wss:// in production.
gateway_url = "wss://example.invalid/v1/worker/ws"
token = ""
worker_id = ""
qwen_url = "http://127.0.0.1:8001"
reconnect_min = 1.0
reconnect_max = 30.0
request_timeout = 3600.0
max_queue = 32
