name: Cross-platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install management and test dependencies (no torch or models)
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q -m "not hardware"
      - name: CLI help
        run: python -m qwen3_tts_web --help
      - name: Shell bootstrap
        if: runner.os != 'Windows'
        run: |
          bash -n scripts/bootstrap.sh
          bash scripts/bootstrap.sh --help
      - name: PowerShell bootstrap
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/bootstrap.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw $errors }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/bootstrap.ps1 --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}
          path: dist/*
